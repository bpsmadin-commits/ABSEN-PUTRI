    .container { max-width: 1200px; margin: 0 auto; }
    .header {

      border-radius: 20px;
      padding: 16px 20px;

    .nm-card {
      background: #eef2f7;
      padding: 20px;

      background: #eef2f7;

      color: #2d3748;
      font-weight: 500;
    }
    .btn-row { display: flex; gap: 12px; flex-wrap: wrap; }
    .btn {
      padding: 12px 18px;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;

      background: #eef2f7;

      padding: 16px;

      font-weight: 700;
      font-size: 16px;

      width: 100%;

<script>
  // === ISI CONFIG FIREBASE LO DI SINI (dari Firebase Console > Project Settings > Web App) ===
  const firebaseConfig = {
    apiKey: "AIzaSyCnLPbLi5a0REFooVcRdIeJGPi0OyvPb24",
    databaseURL: "https://absenputri-5d8a1-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "absenputri-5d8a1"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  function slugKey(s) {
    return String(s).trim().replace(/[.#$\[\]\/]/g, '_');
  }

  // Simpan absensi ke Firebase (key deterministik = otomatis anti-double, timpa kalau sama)
  function kirimKeFirebase(tanggal, lembaga, records) {
    const lembagaKey = slugKey(lembaga);
    records.forEach(rec => {
      const key = slugKey(rec.kelas) + '__' + slugKey(rec.jam) + '__' + slugKey(rec.guru);
      db.ref('absensi/' + lembagaKey + '/' + tanggal + '/' + key).set(rec)
        .catch(err => console.error('Gagal simpan ke Firebase:', err));
    });
  }

  // Tarik semua data absensi lembaga tertentu dari Firebase
  function tarikDataDariFirebase(lembaga) {
    const lembagaKey = slugKey(lembaga);
    return db.ref('absensi/' + lembagaKey).once('value')
      .then(snap => {
        const val = snap.val() || {};
        const hasil = [];
        Object.keys(val).forEach(tanggal => {
          Object.keys(val[tanggal]).forEach(k => hasil.push(val[tanggal][k]));
        });
        return hasil;
      })
      .catch(err => { console.error('Gagal tarik data Firebase:', err); return []; });
  }

  // Gabungkan data dari Firebase ke data lokal (Firebase jadi acuan utama, key sudah unik jadi gak akan double)
  function gabungkanDataSheet(dataLokal, dataSheet) {
    const kunci = r => [r.tanggal, r.lembaga, r.kelas, r.jam, r.guru].join('|');
    const map = {};
    dataLokal.forEach(r => map[kunci(r)] = r);
    dataSheet.forEach(r => map[kunci(r)] = r);
    return Object.values(map);
  }

  function getLocalISOString() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  const LIST_HARI = ['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Ahad'];

  // ========================================================================
  // MODUL MI
  // ========================================================================
  function initModulMI() {
    const P = 'mi-';
    const $ = function(id) { return document.getElementById(P + id); };

    let dataAbsensi = [];
    let jadwalAktif = {};
    let hariAktifDipilih = 'Senin';

    function loadSemuaData() {
      const savedAbsen = localStorage.getItem('mi_absenGuru');
      dataAbsensi = savedAbsen ? JSON.parse(savedAbsen) : [];
      const savedJadwal = localStorage.getItem('mi_jadwalCustom');
      if (savedJadwal) {
        jadwalAktif = JSON.parse(savedJadwal);
      } else {
        const grouped = {};
        defaultDataMI.forEach(item => {
          if (!grouped[item.hari]) grouped[item.hari] = [];
          grouped[item.hari].push({ kelas: item.kelas, jam: item.jam, mapel: item.mapel, guru: item.guru });
        });
        jadwalAktif = grouped;
      }
    }

    function saveDataAbsen() { localStorage.setItem('mi_absenGuru', JSON.stringify(dataAbsensi)); }
    function saveJadwalCustom() { localStorage.setItem('mi_jadwalCustom', JSON.stringify(jadwalAktif)); }

    function renderHariTabs(tanggal) {
      const container = $('hariTabs');
      if (!tanggal) { container.innerHTML = ''; return; }
      const [y, m, d] = tanggal.split('-');
      const tgl = new Date(y, m-1, d);
      const hariIni = LIST_HARI[tgl.getDay() === 0 ? 6 : tgl.getDay() - 1];
      
      let html = '';
      LIST_HARI.forEach((hari) => {
        const items = jadwalAktif[hari] || [];
        const isToday = hari === hariIni;
        const isLibur = items.length === 0;
        let classes = 'hari-tab-btn';
        if (isToday) classes += ' hari-ini';
        if (isLibur) classes += ' hari-libur-tab';
        if (hariAktifDipilih === hari) classes += ' active';
        html += `<button class="${classes}" data-hari="${hari}">${hari} <span style="font-size:11px;opacity:0.8;">(${items.length})</span> ${isToday ? '🔆' : ''}</button>`;
      });
      container.innerHTML = html;

      container.querySelectorAll('.hari-tab-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          hariAktifDipilih = this.dataset.hari;
          container.querySelectorAll('.hari-tab-btn').forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          renderKontenHariDipilih(tanggal);
        });
      });
    }

    function renderKontenHariDipilih(tanggal) {
      const panelContainer = $('hariContentPanels');
      const existing = dataAbsensi.filter(a => a.tanggal === tanggal);
      const hari = hariAktifDipilih;
      const items = jadwalAktif[hari] || [];
      
      let html = '';
      if (items.length === 0) {
        html = `<div class="hari-content-panel active" data-hari="${hari}"><div class="hari-libur">📌 Libur / Tidak ada jadwal</div></div>`;
      } else {
        let cardHtml = `<div class="hari-content-panel active" data-hari="${hari}">`;
        items.forEach(item => {
          const match = existing.find(e => e.kelas === item.kelas && e.jam === item.jam && e.guru === item.guru);
          const activeStatus = match ? match.status : '';
          cardHtml += `
          <div class="guru-card" style="margin-bottom:12px;">
            <div class="meta-row">
              <div class="jam-tag">${item.jam}</div>
              <div class="kelas-tag arab-text">${item.kelas}</div>
            </div>
            <div class="info-row">
              <div class="mapel-lbl arab-text">${item.mapel}</div>
              <div class="guru-lbl arab-text">${item.guru}</div>
            </div>
            <div class="btn-group-hia">
              <button class="btn-hia btn-h ${activeStatus==='H'?'active':''}" data-status="H" data-kelas="${item.kelas}" data-jam="${item.jam}" data-mapel="${item.mapel}" data-guru="${item.guru}">H</button>
              <button class="btn-hia btn-i ${activeStatus==='I'?'active':''}" data-status="I" data-kelas="${item.kelas}" data-jam="${item.jam}" data-mapel="${item.mapel}" data-guru="${item.guru}">I</button>
              <button class="btn-hia btn-a ${activeStatus==='A'?'active':''}" data-status="A" data-kelas="${item.kelas}" data-jam="${item.jam}" data-mapel="${item.mapel}" data-guru="${item.guru}">A</button>
            </div>
          </div>`;
        });
        cardHtml += `</div>`;
        html = cardHtml;
      }
      panelContainer.innerHTML = html;

      panelContainer.querySelectorAll('.btn-hia').forEach(btn => {
        btn.addEventListener('click', function() {
          const parent = this.closest('.btn-group-hia');
          if (this.classList.contains('active')) {
            this.classList.remove('active');
          } else {
            parent.querySelectorAll('.btn-hia').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
          }
        });
      });
    }

    function renderSemuaHari(tanggal, tanpaSync) {
      const info = $('infoJadwal');
      if (!tanggal) {
        info.innerHTML = '⚠️ Pilih tanggal operasional terlebih dahulu.';
        $('hariTabs').innerHTML = '';
        $('hariContentPanels').innerHTML = '';
        return;
      }

      const [y, m, d] = tanggal.split('-');
      const tgl = new Date(y, m-1, d);
      const hariIni = LIST_HARI[tgl.getDay() === 0 ? 6 : tgl.getDay() - 1];
      info.innerHTML = `🗓️ Jadwal untuk <strong>${tanggal}</strong> — Hari ini: <strong>${hariIni}</strong>`;
      
      hariAktifDipilih = hariIni;
      renderHariTabs(tanggal);
      renderKontenHariDipilih(tanggal);

      const hasAnyJadwal = LIST_HARI.some(h => (jadwalAktif[h] || []).length > 0);
      $('areaAksiSimpan').style.display = hasAnyJadwal ? 'flex' : 'none';

      if (!tanpaSync) {
        tarikDataDariFirebase('MI Miftahul Ulum').then(dataSheet => {
          const sebelumnya = JSON.stringify(dataAbsensi);
          dataAbsensi = gabungkanDataSheet(dataAbsensi, dataSheet);
          if (JSON.stringify(dataAbsensi) !== sebelumnya) {
            saveDataAbsen();
            renderKontenHariDipilih(tanggal);
          }
        });
      }
    }

    function simpanAbsensi() {
      const tanggal = $('tanggal').value;
      if (!tanggal) return;
      dataAbsensi = dataAbsensi.filter(a => a.tanggal !== tanggal);
      const cards = document.querySelectorAll('#mi-hariContentPanels .guru-card');
      let savedCount = 0;
      const recordsForSheet = [];
      
      cards.forEach(card => {
        const activeBtn = card.querySelector('.btn-group-hia .active');
        if (activeBtn) {
          const record = {
            tanggal, lembaga: 'MI Miftahul Ulum',
            kelas: activeBtn.dataset.kelas, jam: activeBtn.dataset.jam,
            mapel: activeBtn.dataset.mapel, guru: activeBtn.dataset.guru,
            status: activeBtn.dataset.status
          };
          dataAbsensi.push(record);
          recordsForSheet.push(record);
          savedCount++;
        }
      });
      
      const statusEl = $('status');
      if (savedCount === 0) {
        statusEl.innerHTML = '⚠️ Gagal menyimpan, tidak ada status H/I/A yang dipilih.';
        statusEl.className = 'status-box status-error';

  function initModulMTsD() {
    const P = 'mtsd-';

    let dataAbsensi = [];

    let hariAktifDipilih = 'Senin';

    function loadSemuaData() {
      const savedAbsen = localStorage.getItem('mtsd_absenGuru');
      dataAbsensi = savedAbsen ? JSON.parse(savedAbsen) : [];
      const savedJadwal = localStorage.getItem('mtsd_jadwalCustom');
      jadwalAktif = savedJadwal ? JSON.parse(savedJadwal) : JSON.parse(JSON.stringify(jadwalDefaultMTsD));
    }

    function saveDataAbsen() { localStorage.setItem('mtsd_absenGuru', JSON.stringify(dataAbsensi)); }
    function saveJadwalCustom() { localStorage.setItem('mtsd_jadwalCustom', JSON.stringify(jadwalAktif)); }

    function renderHariTabs(tanggal) {
      const container = $('hariTabs');
      if (!tanggal) { container.innerHTML = ''; return; }
      const [y, m, d] = tanggal.split('-');
      const tgl = new Date(y, m-1, d);
      const hariIni = LIST_HARI[tgl.getDay() === 0 ? 6 : tgl.getDay() - 1];
      
      let html = '';
      LIST_HARI.forEach((hari) => {
        const items = jadwalAktif[hari] || [];
        const isToday = hari === hariIni;
        const isLibur = items.length === 0;
        let classes = 'hari-tab-btn';
        if (isToday) classes += ' hari-ini';
        if (isLibur) classes += ' hari-libur-tab';
        if (hariAktifDipilih === hari) classes += ' active';
        html += `<button class="${classes}" data-hari="${hari}">${hari} <span style="font-size:11px;opacity:0.8;">(${items.length})</span> ${isToday ? '🔆' : ''}</button>`;
      });
      container.innerHTML = html;

      container.querySelectorAll('.hari-tab-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          hariAktifDipilih = this.dataset.hari;
          container.querySelectorAll('.hari-tab-btn').forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          renderKontenHariDipilih(tanggal);
        });
      });
    }

    function renderKontenHariDipilih(tanggal) {
      const panelContainer = $('hariContentPanels');
      const existing = dataAbsensi.filter(a => a.tanggal === tanggal);
      const hari = hariAktifDipilih;
      const items = jadwalAktif[hari] || [];
      
      let html = '';
      if (items.length === 0) {
        html = `<div class="hari-content-panel active" data-hari="${hari}"><div class="hari-libur">📌 Libur / Tidak ada jadwal</div></div>`;
      } else {
        let cardHtml = `<div class="hari-content-panel active" data-hari="${hari}">`;
        items.forEach(item => {
          const match = existing.find(e => e.kelas === item.kelas && e.jam === item.jam && e.guru === item.guru);
          const activeStatus = match ? match.status : '';
          cardHtml += `
          <div class="guru-card" style="margin-bottom:12px;">
            <div class="meta-row">
              <div class="jam-tag">${item.jam}</div>
              <div class="kelas-tag arab-text">${item.kelas}</div>
            </div>
            <div class="info-row">
              <div class="mapel-lbl arab-text">${item.mapel}</div>
              <div class="guru-lbl arab-text">${item.guru}</div>
            </div>
            <div class="btn-group-hia">
              <button class="btn-hia btn-h ${activeStatus==='H'?'active':''}" data-status="H" data-kelas="${item.kelas}" data-jam="${item.jam}" data-mapel="${item.mapel}" data-guru="${item.guru}">H</button>
              <button class="btn-hia btn-i ${activeStatus==='I'?'active':''}" data-status="I" data-kelas="${item.kelas}" data-jam="${item.jam}" data-mapel="${item.mapel}" data-guru="${item.guru}">I</button>
              <button class="btn-hia btn-a ${activeStatus==='A'?'active':''}" data-status="A" data-kelas="${item.kelas}" data-jam="${item.jam}" data-mapel="${item.mapel}" data-guru="${item.guru}">A</button>
            </div>
          </div>`;
        });
        cardHtml += `</div>`;
        html = cardHtml;
      }
      panelContainer.innerHTML = html;

      panelContainer.querySelectorAll('.btn-hia').forEach(btn => {
        btn.addEventListener('click', function() {
          const parent = this.closest('.btn-group-hia');
          if (this.classList.contains('active')) {
            this.classList.remove('active');
          } else {
            parent.querySelectorAll('.btn-hia').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
          }
        });
      });
    }

    function renderSemuaHari(tanggal, tanpaSync) {
      const info = $('infoJadwal');
      if (!tanggal) {
        info.innerHTML = '⚠️ Pilih tanggal operasional terlebih dahulu.';
        $('hariTabs').innerHTML = '';
        $('hariContentPanels').innerHTML = '';
        return;
      }

      const [y, m, d] = tanggal.split('-');
      const tgl = new Date(y, m-1, d);
      const hariIni = LIST_HARI[tgl.getDay() === 0 ? 6 : tgl.getDay() - 1];
      info.innerHTML = `🗓️ Jadwal untuk <strong>${tanggal}</strong> — Hari ini: <strong>${hariIni}</strong>`;
      
      hariAktifDipilih = hariIni;
      renderHariTabs(tanggal);
      renderKontenHariDipilih(tanggal);

      const hasAnyJadwal = LIST_HARI.some(h => (jadwalAktif[h] || []).length > 0);
      $('areaAksiSimpan').style.display = hasAnyJadwal ? 'flex' : 'none';

        tarikDataDariFirebase('MTsD').then(dataSheet => {

        const panel = document.getElementById(P + 'panel-' + tabName);
        if (panel) panel.style.display = 'block';
        if (tabName === 'rekap') tampilkanRekap();
        if (tabName === 'pengaturan') renderFormPengaturan();
      });
    });

    $('tanggal').addEventListener('change', () => renderSemuaHari($('tanggal').value));
    $('btnHariIni').addEventListener('click', () => {
      const tgl = getLocalISOString();
      $('tanggal').value = tgl;
      renderSemuaHari(tgl);
    });
    $('btnSimpan').addEventListener('click', simpanAbsensi);
    $('btnResetPilihan').addEventListener('click', resetPilihanHariIni);
    $('btnRekap').addEventListener('click', tampilkanRekap);
    $('btnExportExcel').addEventListener('click', exportKeExcel);
    $('btnClearAllDB').addEventListener('click', clearAllDatabase);
    $('hariPengaturan').addEventListener('change', renderFormPengaturan);
    $('btnTambahBaris').addEventListener('click', () => tambahkanBarisForm());
    $('btnSimpanPengaturan').addEventListener('click', simpanPerubahanJadwal);
    $('btnResetJadwalDefault').addEventListener('click', kembalikanJadwalDefault);

    renderSemuaHari(todayStr);
  }

  // ========================================================================
  // SWITCHER LEMBAGA
  // ========================================================================
  document.querySelectorAll('.tab-lembaga .btn').forEach(btn => {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.tab-lembaga .btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      const mod = this.dataset.module;
      document.querySelectorAll('.module-container').forEach(el => el.classList.remove('active'));
      document.getElementById('module-' + mod).classList.add('active');
    });
  });

  document.addEventListener('DOMContentLoaded', function() {
    console.log('DOM siap, menginisialisasi modul...');
    initModulMI();
    initModulMTsD();
    console.log('Inisialisasi selesai.');
  });
</script>
</body>
</html>
