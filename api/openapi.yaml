openapi: 3.0.3
info:
  title: API Absensi
  version: 1.0.0
  description: API read-only untuk membaca absensi berdasarkan tanggal.
servers:
  - url: https://domain-api-kamu.vercel.app
paths:
  /api/data:
    get:
      operationId: getAbsensi
      summary: Baca data absensi
      security:
        - apiKey: []
      parameters:
        - name: tanggal
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          example: '2026-09-04'
        - name: lembaga
          in: query
          required: false
          schema:
            type: string
          example: MID
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [H, I, A, S]
          description: H=Hadir, I=Izin, A=Alpa, S=Sakit
      responses:
        '200':
          description: Data absensi
          content:
            application/json:
              schema:
                type: object
                properties:
                  tanggal:
                    type: string
                  lembaga:
                    type: string
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        guru: { type: string }
                        kelas: { type: string }
                        jam: { type: string }
                        mapel: { type: string }
                        status: { type: string, nullable: true }
                        lembaga: { type: string }
        '401':
          description: API key tidak valid
        '400':
          description: Parameter tidak valid
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
